# Ultimate Sim App MQTT v1 certification broker.
# Local-only with generated per-role authentication; every listener is loopback-bound.
# This reference profile uses IPv4. If the app host is ::1, replace every
# listener host 127.0.0.1 below with ::1 before starting Mosquitto.
per_listener_settings true
persistence false
max_packet_size 16384
message_size_limit 16384
max_queued_messages 64

# App publisher + optional command subscription.
listener 1883 127.0.0.1
allow_anonymous false
password_file mqtt-publisher.passwd
acl_file mqtt-publisher.acl

# Read-only integrations (Home Assistant, Node-RED, local dashboards).
listener 1884 127.0.0.1
allow_anonymous false
password_file mqtt-reader.passwd
acl_file mqtt-reader.acl

# Commands are default-off. Uncomment only after enabling the command namespace
# in the app; driving/gameplay-control capabilities are never defined.
# listener 1885 127.0.0.1
# allow_anonymous false
# password_file mqtt-command.passwd
# acl_file mqtt-command.acl
