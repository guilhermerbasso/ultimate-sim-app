name: Update README on release

# When a GitHub Release is PUBLISHED, refresh the README's version and the
# plain-language "What's new" highlights, then open a pull request with the change.
# We never push straight to main — a maintainer reviews and merges the PR.
# Drafts do NOT trigger this (the `published` event only fires on real releases).

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20

      - name: Update README from the release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: node .github/scripts/update-readme-from-release.mjs

      - name: Open a pull request with the README update
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          base: main
          branch: chore/readme-${{ github.event.release.tag_name }}
          delete-branch: true
          add-paths: README.md
          commit-message: "docs(readme): highlight ${{ github.event.release.tag_name }} for users"
          title: "docs(readme): highlight ${{ github.event.release.tag_name }} for users"
          body: |
            Automated README refresh for **${{ github.event.release.tag_name }}**.

            - Bumps the app version shown in the README.
            - Adds a plain-language entry to the **What's new** section, taken from the
              release notes so non-technical readers can follow along.

            Generated by `.github/workflows/update-readme-on-release.yml`. Review and merge.
