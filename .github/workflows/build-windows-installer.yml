name: Build Windows Installer

# Builds the "Ultimate Sim App" NSIS .exe installer on a real Windows runner.
# Trigger manually (Actions tab -> Build Windows Installer -> Run workflow) or via a v* tag.
# Manually triggered runs on feat/v2.46-everything also create/update the v2.46.0 draft release.

on:
  workflow_dispatch:
    inputs:
      create_v246_draft:
        description: "Create / update the v2.46.0 draft release with the built installer"
        type: boolean
        default: false
  push:
    tags:
      - "v*"
    branches:
      - "copilot/create-new-exe-release-2-46"

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app-v2
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltimateSimApp-Setup
          path: |
            app-v2/dist-win/*.exe
            app-v2/dist-win/*.zip
            app-v2/dist-win/*.exe.blockmap
            app-v2/dist-win/latest.yml
          if-no-files-found: error

      # On v* tag pushes, attach the installer to a GitHub Release.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app-v2/dist-win/*.exe
            app-v2/dist-win/*.zip
            app-v2/dist-win/*.exe.blockmap
            app-v2/dist-win/latest.yml

      # On the v2.46 release branch push OR when the create_v246_draft input is true,
      # create / update the v2.46.0 draft release with the installer.
      - name: Create v2.46.0 draft release
        if: |
          github.ref == 'refs/heads/copilot/create-new-exe-release-2-46' ||
          (github.event_name == 'workflow_dispatch' && inputs.create_v246_draft == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.46.0
          name: "v2.46.0 — auto-update 404 fix + complete telemetry coverage + diagnostics dashboards"
          draft: true
          generate_release_notes: false
          body: |
            ## v2.46.0 — auto-update 404 fix + complete telemetry coverage + diagnostics dashboards

            ### Fixed
            - **Auto-update 404** — `artifactName` pinned to `Ultimate-Sim-App-${version}-${arch}.${ext}`.
              GitHub was rewriting spaces to dots in the asset name, causing updater URL mismatches.
              Auto-update now works from this release forward.
            - **Duplicate SVG clip-ids** in CarAttitude widget (unique `clipId` per instance).

            ### Added
            - **`irDerived` widget group (12 widgets)** — slip angle, steering-lock %, 3-axis rotation
              rates, attitude horizon, fuel laps-left, sun position, GPS+heading, decoded race-control
              flags, shift point, engine telltale, raw spotter, session id.
              **Telemetry gap → 0** (every widget-able snapshot field now has a widget).
            - **5 diagnostics/dynamics dashboards** composed from those widgets.
            - **i18n** — 5 additional views migrated to `tt()` across all 7 languages (146 new keys).
          files: |
            app-v2/dist-win/*.exe
            app-v2/dist-win/*.zip
            app-v2/dist-win/*.exe.blockmap
            app-v2/dist-win/latest.yml
