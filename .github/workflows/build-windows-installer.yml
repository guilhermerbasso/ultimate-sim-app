name: Build Windows Installer

# Builds the "Ultimate Sim App" NSIS .exe installer on a real Windows runner.
# Trigger manually (Actions tab -> Build Windows Installer -> Run workflow) or via a v* tag.

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build-win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app-v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run dist:win

      - name: Verify packaged cloudflared and artifacts
        run: npm run verify:win-package

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: UltimateSimApp-Setup
          path: |
            app-v2/dist-win/*.exe
            app-v2/dist-win/*.zip
            app-v2/dist-win/*.exe.blockmap
            app-v2/dist-win/latest.yml
          if-no-files-found: error

      # On v* tag pushes, attach the installer to a GitHub Release.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            app-v2/dist-win/*.exe
            app-v2/dist-win/*.zip
            app-v2/dist-win/*.exe.blockmap
            app-v2/dist-win/latest.yml
