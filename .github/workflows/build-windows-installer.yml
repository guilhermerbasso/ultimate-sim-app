name: Build Windows Installer

# Builds the "Ultimate Sim App" NSIS .exe installer on a real Windows runner.
# Trigger manually (Actions tab -> Build Windows Installer -> Run workflow) or via a v* tag.

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app-v2
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UltimateSimApp-Setup
          path: |
            app-v2/dist-win/*.exe
            app-v2/dist-win/*.zip
            app-v2/dist-win/*.exe.blockmap
            app-v2/dist-win/latest.yml
          if-no-files-found: error

      # On v* tag pushes, attach the installer to a GitHub Release.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            app-v2/dist-win/*.exe
            app-v2/dist-win/*.zip
            app-v2/dist-win/*.exe.blockmap
            app-v2/dist-win/latest.yml
