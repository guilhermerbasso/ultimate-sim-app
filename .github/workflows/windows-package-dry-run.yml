name: Windows package dry run

on:
  pull_request:
    paths:
      - "app-v2/**"
      - "driver/**"
      - ".github/workflows/windows-package-dry-run.yml"
      - ".github/workflows/build-windows-installer.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  package-win:
    name: Package Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app-v2

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows package
        run: npm run dist:win

      - name: Verify packaged cloudflared and artifacts
        run: npm run verify:win-package
