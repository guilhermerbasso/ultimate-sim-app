name: Windows package dry run

on:
  pull_request:
    paths:
      - "app-v2/**"
      - "driver/**"
      - ".github/workflows/windows-package-dry-run.yml"
      - ".github/workflows/build-windows-installer.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  package-win:
    name: Package Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app-v2

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows package
        run: npm run dist:win

      - name: Verify packaged cloudflared and artifacts
        run: npm run verify:win-package
