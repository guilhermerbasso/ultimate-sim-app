name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contracts:
    name: Contract checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Setup Buf
        uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1
        with:
          version: 1.71.0
          checksum: d3de2838c68a5759ca276884254bc70df4e4ad185d6ed5f65f327b6ce6363eab
          setup_only: true

      - name: Verify Phase 02 contracts
        env:
          CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/verify-phase02-contracts.mjs

  app:
    name: App checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app-v2

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app-v2/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify action pins
        shell: pwsh
        run: |
          @'
          const fs = require('node:fs')
          const path = require('node:path')
          const YAML = require('yaml')

          const root = path.join(process.env.GITHUB_WORKSPACE, '.github', 'workflows')
          const violations = []

          function visit(value, location, file) {
            if (Array.isArray(value)) {
              value.forEach((item, index) => visit(item, `${location}[${index}]`, file))
              return
            }
            if (!value || typeof value !== 'object') return

            for (const [key, child] of Object.entries(value)) {
              const childLocation = `${location}.${key}`
              if (key === 'uses' && (
                typeof child !== 'string' ||
                (!child.startsWith('./') && !/^[^@\s/]+\/[^@\s]*@[0-9a-fA-F]{40}$/.test(child))
              )) {
                violations.push(`${file}:${childLocation}: ${JSON.stringify(child)}`)
              }
              visit(child, childLocation, file)
            }
          }

          for (const file of fs.readdirSync(root).filter((name) => /\.ya?ml$/i.test(name))) {
            visit(YAML.parse(fs.readFileSync(path.join(root, file), 'utf8')), '$', file)
          }

          if (violations.length) {
            console.error('External actions must be local or pinned to a full 40-character commit SHA:\n' +
              violations.join('\n'))
            process.exit(1)
          }
          '@ | node -

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  passport-acceptance:
    name: Stint Passport V2 acceptance
    needs:
      - contracts
      - app
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app-v2/package-lock.json

      - name: Setup Buf
        uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1
        with:
          version: 1.71.0
          checksum: b003ead3eebe7920a4e6f748fdf5b666e4763637a7fb1837c975ac9c5d21d558
          setup_only: true

      - name: Install dependencies
        working-directory: app-v2
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run source-bound acceptance
        env:
          CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/run-passport-v2-acceptance.mjs

      - name: Generate runtime evidence
        run: node scripts/generate-passport-v2-run-manifest.mjs

      - name: Upload acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stint-passport-v2-acceptance-${{ github.sha }}
          path: artifacts/stint-passport-v2
          if-no-files-found: error
          retention-days: 30

      - name: Attest runtime evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: artifacts/stint-passport-v2/stint-passport-v2-run-manifest.json
