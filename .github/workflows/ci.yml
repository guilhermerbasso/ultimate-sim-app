name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  encoding:
    name: Encoding integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Byte scan over every tracked text file. Windows PowerShell 5.1 writes a UTF-8 BOM for
      # `Set-Content -Encoding UTF8` / `Out-File -Encoding utf8`, and its `Get-Content` decodes
      # UTF-8 through the ANSI code page, so a single round-trip both prepends EF BB BF and
      # turns every accented character into mojibake. This job refuses such content on any
      # path, including the many outside `app-v2/src` that i18n-encoding.test.ts never sees.
      - name: Scan tracked files for BOMs, invalid UTF-8 and mojibake
        env:
          ENCODING_COMMIT_RANGE: >-
            ${{ github.event_name == 'pull_request'
              && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
              || '' }}
        run: |
          if [ -n "$ENCODING_COMMIT_RANGE" ]; then
            node scripts/check-encoding.mjs --commits "$ENCODING_COMMIT_RANGE"
          else
            node scripts/check-encoding.mjs
          fi

  contracts:
    name: Contract checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          version: 1.71.0
          checksum: d3de2838c68a5759ca276884254bc70df4e4ad185d6ed5f65f327b6ce6363eab
          setup_only: true

      - name: Verify Phase 02 contracts
        env:
          CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/verify-phase02-contracts.mjs

  app:
    name: App checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app-v2

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app-v2/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Electron test runtime
        run: node node_modules/electron/install.js

      - name: Verify action pins
        shell: pwsh
        run: |
          @'
          const fs = require('node:fs')
          const path = require('node:path')
          const YAML = require('yaml')

          const root = path.join(process.env.GITHUB_WORKSPACE, '.github', 'workflows')
          const violations = []

          function visit(value, location, file) {
            if (Array.isArray(value)) {
              value.forEach((item, index) => visit(item, `${location}[${index}]`, file))
              return
            }
            if (!value || typeof value !== 'object') return

            for (const [key, child] of Object.entries(value)) {
              const childLocation = `${location}.${key}`
              if (key === 'uses' && (
                typeof child !== 'string' ||
                (!child.startsWith('./') && !/^[^@\s/]+\/[^@\s]*@[0-9a-fA-F]{40}$/.test(child))
              )) {
                violations.push(`${file}:${childLocation}: ${JSON.stringify(child)}`)
              }
              visit(child, childLocation, file)
            }
          }

          for (const file of fs.readdirSync(root).filter((name) => /\.ya?ml$/i.test(name))) {
            visit(YAML.parse(fs.readFileSync(path.join(root, file), 'utf8')), '$', file)
          }

          if (violations.length) {
            console.error('External actions must be local or pinned to a full 40-character commit SHA:\n' +
              violations.join('\n'))
            process.exit(1)
          }
          '@ | node -

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  passport-acceptance:
    name: Stint Passport V2 acceptance
    needs:
      - contracts
      - app
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app-v2/package-lock.json

      - name: Setup Buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          version: 1.71.0
          checksum: b003ead3eebe7920a4e6f748fdf5b666e4763637a7fb1837c975ac9c5d21d558
          setup_only: true

      - name: Install dependencies
        working-directory: app-v2
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Electron test runtime
        working-directory: app-v2
        run: node node_modules/electron/install.js

      - name: Run source-bound acceptance
        env:
          CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/run-passport-v2-acceptance.mjs

      - name: Generate runtime evidence
        run: node scripts/generate-passport-v2-run-manifest.mjs

      - name: Upload acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stint-passport-v2-acceptance-${{ github.sha }}
          path: artifacts/stint-passport-v2
          if-no-files-found: error
          retention-days: 30

      - name: Attest runtime evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: artifacts/stint-passport-v2/stint-passport-v2-run-manifest.json
