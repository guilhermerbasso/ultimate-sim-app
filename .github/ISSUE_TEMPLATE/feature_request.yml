name: Feature request
description: Suggest an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should the app or hardware support?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Describe the simulator, hardware, or workflow this helps.
    validations:
      required: true
  - type: textarea
    id: ideas
    attributes:
      label: Possible approach
      description: Optional implementation ideas or references.
