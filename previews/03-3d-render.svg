<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500">
  <defs>
    <linearGradient id="topFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a5a6e"/>
      <stop offset="100%" stop-color="#3a3a4e"/>
    </linearGradient>
    <linearGradient id="frontFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e2e40"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
    <linearGradient id="sideFace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#25253a"/>
      <stop offset="100%" stop-color="#1a1a2a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="700" height="500" fill="#080812"/>
  <text x="350" y="35" font-family="Arial" font-size="16" font-weight="bold" fill="#0078D4" text-anchor="middle">3D Render — Button Box V2</text>
  <text x="350" y="52" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">200 × 120 × 40mm · PETG · Bambu A1 (~4h)</text>

  <!-- 3D isometric box -->
  <!-- Top face (isometric) -->
  <polygon points="150,160 450,120 550,200 250,240" fill="url(#topFace)" stroke="#6a6a8e" stroke-width="1.5"/>
  <!-- Front face -->
  <polygon points="150,160 250,240 250,330 150,250" fill="url(#frontFace)" stroke="#4a4a6e" stroke-width="1.5"/>
  <!-- Right face -->
  <polygon points="250,240 550,200 550,290 250,330" fill="url(#sideFace)" stroke="#3a3a5e" stroke-width="1.5"/>

  <!-- ENCODER holes on top (6 circles) -->
  <!-- Row 1: 3 encoders -->
  <ellipse cx="210" cy="172" rx="12" ry="7" fill="#111" stroke="#555" stroke-width="1"/>
  <ellipse cx="280" cy="160" rx="12" ry="7" fill="#111" stroke="#555" stroke-width="1"/>
  <ellipse cx="350" cy="148" rx="12" ry="7" fill="#111" stroke="#555" stroke-width="1"/>
  <!-- Row 2: 3 encoders -->
  <ellipse cx="235" cy="198" rx="12" ry="7" fill="#111" stroke="#555" stroke-width="1"/>
  <ellipse cx="305" cy="186" rx="12" ry="7" fill="#111" stroke="#555" stroke-width="1"/>
  <ellipse cx="375" cy="174" rx="12" ry="7" fill="#111" stroke="#555" stroke-width="1"/>

  <!-- Knobs on encoders -->
  <ellipse cx="210" cy="170" rx="9" ry="5" fill="#2a2a3e" stroke="#777" stroke-width="1.5"/>
  <ellipse cx="280" cy="158" rx="9" ry="5" fill="#2a2a3e" stroke="#777" stroke-width="1.5"/>
  <ellipse cx="350" cy="146" rx="9" ry="5" fill="#2a2a3e" stroke="#777" stroke-width="1.5"/>
  <ellipse cx="235" cy="196" rx="9" ry="5" fill="#2a2a3e" stroke="#777" stroke-width="1.5"/>
  <ellipse cx="305" cy="184" rx="9" ry="5" fill="#2a2a3e" stroke="#777" stroke-width="1.5"/>
  <ellipse cx="375" cy="172" rx="9" ry="5" fill="#2a2a3e" stroke="#777" stroke-width="1.5"/>

  <!-- OLED window on top -->
  <polygon points="415,132 495,125 500,148 420,155" fill="#000d18" stroke="#0078D4" stroke-width="1.5"/>
  <text x="457" y="142" font-family="Courier New" font-size="6" fill="#00ff41" text-anchor="middle">BB:52.5</text>
  <text x="457" y="151" font-family="Courier New" font-size="5" fill="#00aaff" text-anchor="middle">MAP:3 TC:5</text>
  <rect x="415" y="125" width="85" height="30" rx="0" fill="none" stroke="#0078D4" stroke-width="1.5" filter="url(#glow)"/>

  <!-- USB slot on front face -->
  <polygon points="165,255 185,255 185,270 165,270" fill="#000" stroke="#555" stroke-width="1"/>
  <text x="175" y="280" font-family="Arial" font-size="7" fill="#555" text-anchor="middle">USB</text>

  <!-- M3 screws (4 corners visible) -->
  <circle cx="165" cy="165" r="4" fill="#333" stroke="#666" stroke-width="1"/>
  <circle cx="165" cy="175" r="2" fill="#555"/>
  <circle cx="435" cy="128" r="4" fill="#333" stroke="#666" stroke-width="1"/>
  <circle cx="435" cy="138" r="2" fill="#555"/>
  <circle cx="165" cy="245" r="4" fill="#333" stroke="#666" stroke-width="1"/>
  <circle cx="240" cy="237" r="4" fill="#333" stroke="#666" stroke-width="1"/>

  <!-- Encoder labels on top face (isometric) -->
  <text x="210" y="193" font-family="Arial" font-size="7" fill="#0078D4" text-anchor="middle">BB</text>
  <text x="280" y="182" font-family="Arial" font-size="7" fill="#0078D4" text-anchor="middle">MAP</text>
  <text x="350" y="169" font-family="Arial" font-size="7" fill="#0078D4" text-anchor="middle">TC</text>
  <text x="235" y="218" font-family="Arial" font-size="7" fill="#0078D4" text-anchor="middle">ABS</text>
  <text x="305" y="206" font-family="Arial" font-size="7" fill="#0078D4" text-anchor="middle">FUEL</text>
  <text x="375" y="194" font-family="Arial" font-size="7" fill="#888" text-anchor="middle">FREE</text>

  <!-- Dimension annotations -->
  <line x1="130" y1="160" x2="130" y2="250" stroke="#444" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="122" y1="160" x2="138" y2="160" stroke="#444" stroke-width="1"/>
  <line x1="122" y1="250" x2="138" y2="250" stroke="#444" stroke-width="1"/>
  <text x="115" y="208" font-family="Arial" font-size="9" fill="#666" text-anchor="middle" transform="rotate(-90, 115, 208)">40mm</text>

  <line x1="150" y1="350" x2="250" y2="350" stroke="#444" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="150" y1="342" x2="150" y2="358" stroke="#444" stroke-width="1"/>
  <line x1="250" y1="342" x2="250" y2="358" stroke="#444" stroke-width="1"/>
  <text x="200" y="368" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">120mm</text>

  <line x1="150" y1="380" x2="550" y2="340" stroke="#444" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="350" y="400" font-family="Arial" font-size="9" fill="#666" text-anchor="middle">200mm</text>

  <!-- Print info -->
  <rect x="530" y="140" width="150" height="130" rx="6" fill="#111" stroke="#333"/>
  <text x="605" y="160" font-family="Arial" font-size="10" font-weight="bold" fill="#0078D4" text-anchor="middle">Print Settings</text>
  <text x="545" y="178" font-family="Arial" font-size="9" fill="#aaa">Material:</text>
  <text x="610" y="178" font-family="Arial" font-size="9" fill="#ccc">PETG</text>
  <text x="545" y="193" font-family="Arial" font-size="9" fill="#aaa">Bico:</text>
  <text x="610" y="193" font-family="Arial" font-size="9" fill="#ccc">230°C</text>
  <text x="545" y="208" font-family="Arial" font-size="9" fill="#aaa">Cama:</text>
  <text x="610" y="208" font-family="Arial" font-size="9" fill="#ccc">70°C</text>
  <text x="545" y="223" font-family="Arial" font-size="9" fill="#aaa">Layer:</text>
  <text x="610" y="223" font-family="Arial" font-size="9" fill="#ccc">0.2mm</text>
  <text x="545" y="238" font-family="Arial" font-size="9" fill="#aaa">Infill:</text>
  <text x="610" y="238" font-family="Arial" font-size="9" fill="#ccc">40%</text>
  <text x="545" y="253" font-family="Arial" font-size="9" fill="#aaa">Tempo:</text>
  <text x="610" y="253" font-family="Arial" font-size="9" fill="#00aa44">~4 horas</text>

  <!-- Notes -->
  <text x="350" y="440" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">Tampa (tampa) + Base (base) = 2 peças separadas | Furos M3 passantes nos 4 cantos</text>
  <text x="350" y="455" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">Janela OLED: 28×16mm | 6× furos encoder Ø7mm | Slot USB frontal</text>
  <text x="350" y="488" font-family="Arial" font-size="8" fill="#333" text-anchor="middle">P2.3 3D Render — Guilherme Basso iRacing DIY — cad/buttonbox_case.scad</text>
</svg>
